spring:
  application:
    name: orchestrator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tamada}
    username: ${SPRING_DATASOURCE_USERNAME:tamada}
    password: ${SPRING_DATASOURCE_PASSWORD:tamada}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

services:
  flight:
    base-url: ${SERVICES_FLIGHT_BASE_URL:http://localhost:3001}
  hotel:
    base-url: ${SERVICES_HOTEL_BASE_URL:http://localhost:3002}
  insurance:
    base-url: ${SERVICES_INSURANCE_BASE_URL:http://localhost:3003}
  transfer:
    base-url: ${SERVICES_TRANSFER_BASE_URL:http://localhost:3004}
  connect-timeout: 5s
  read-timeout: 10s
  retry:
    max-attempts: 3
    initial-delay: 200ms
    multiplier: 2.0
    max-delay: 2s

saga:
  recovery:
    enabled: true
    stuck-threshold: 2m
    fixed-delay: 60s
    initial-delay: 60s
  compensation:
    enabled: true
    stuck-threshold: 2m
    fixed-delay: 60s
    initial-delay: 60s

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    topic: tamada.order-events
    batch-size: 50
    fixed-delay: 1s
    initial-delay: 1s
    send-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
