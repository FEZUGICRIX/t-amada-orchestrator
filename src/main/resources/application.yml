spring:
  application:
    name: orchestrator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tamada}
    username: ${SPRING_DATASOURCE_USERNAME:tamada}
    password: ${SPRING_DATASOURCE_PASSWORD:tamada}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  flight:
    base-url: ${SERVICES_FLIGHT_BASE_URL:http://localhost:3001}
  hotel:
    base-url: ${SERVICES_HOTEL_BASE_URL:http://localhost:3002}
  insurance:
    base-url: ${SERVICES_INSURANCE_BASE_URL:http://localhost:3003}
  transfer:
    base-url: ${SERVICES_TRANSFER_BASE_URL:http://localhost:3004}
  connect-timeout: 5s
  read-timeout: 10s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
