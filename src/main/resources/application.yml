spring:
  application:
    name: orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5433/tamada
    username: tamada
    password: tamada

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  flight:
    base-url: http://localhost:3001
  hotel:
    base-url: http://localhost:3002
  insurance:
    base-url: http://localhost:3003
  transfer:
    base-url: http://localhost:3004
