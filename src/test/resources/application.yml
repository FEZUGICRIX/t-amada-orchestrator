spring:
  datasource:
    url: jdbc:h2:mem:orchestrator;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 25
  flyway:
    enabled: false

services:
  flight:
    base-url: http://localhost:3001
  hotel:
    base-url: http://localhost:3002
  insurance:
    base-url: http://localhost:3003
  transfer:
    base-url: http://localhost:3004

saga:
  recovery:
    enabled: true
    stuck-threshold: 2m
    fixed-delay: 60s
    initial-delay: 60s
  compensation:
    enabled: true
    stuck-threshold: 2m
    fixed-delay: 60s
    initial-delay: 60s

outbox:
  publisher:
    enabled: false
